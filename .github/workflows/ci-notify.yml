name: CI Failure Notification

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  notify-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      issues: write
    steps:
    - name: Create issue on CI failure
      uses: actions/github-script@v7
      with:
        script: |
          const runUrl = `${context.payload.workflow_run.html_url}`;
          const commitSha = context.payload.workflow_run.head_sha.substring(0, 7);
          const commitMsg = context.payload.workflow_run.head_commit?.message?.split('\n')[0] || 'unknown';
          const actor = context.payload.workflow_run.actor?.login || 'unknown';

          // Check for existing open CI failure issues to avoid duplicates
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'ci-failure',
            per_page: 5
          });

          if (existingIssues.data.length > 0) {
            // Comment on existing issue instead of creating new one
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssues.data[0].number,
              body: `## CI Failed Again\n\n- **Commit:** \`${commitSha}\` - ${commitMsg}\n- **Author:** @${actor}\n- **Run:** ${runUrl}\n- **Date:** ${new Date().toISOString().split('T')[0]}`
            });
            return;
          }

          // Create new issue
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[CI] Build failure on main (${commitSha})`,
            labels: ['ci-failure', 'bug'],
            body: `## CI Pipeline Failed\n\n- **Commit:** \`${commitSha}\` - ${commitMsg}\n- **Author:** @${actor}\n- **Run:** ${runUrl}\n- **Date:** ${new Date().toISOString().split('T')[0]}\n\n## Action Required\n\n1. Check the [failed run](${runUrl}) for error details\n2. Fix the failing tests/build\n3. Push the fix to main\n4. Close this issue when CI is green again\n\n---\n*Auto-generated by CI notification workflow*`
          });

  close-on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      issues: write
      contents: read
    steps:
    - name: Close the ci-failure notifications the green run proves fixed
      uses: actions/github-script@v7
      with:
        script: |
          const run = context.payload.workflow_run;
          const { owner, repo } = context.repo;
          const short = (sha) => sha.substring(0, 7);

          // A green run only speaks for the commit it ran on. If main moved since,
          // the current head's state is unknown: its own run decides, and a still
          // red head opens a fresh notification by itself.
          const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
          if (branch.commit.sha !== run.head_sha) {
            core.info(`${short(run.head_sha)} is not the head of main (${short(branch.commit.sha)}) - nothing to close`);
            return;
          }

          const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'ci-failure', per_page: 100 });
          if (open.length === 0) {
            core.info(`CI is green on ${short(run.head_sha)} - no open ci-failure notification`);
            return;
          }

          const body = [
            '## CI is green again',
            '',
            `- **Commit:** \`${run.head_sha}\` (head of \`main\`)`,
            `- **Run:** ${run.html_url}`,
            `- **Date:** ${new Date().toISOString().split('T')[0]}`,
            '',
            'Closed automatically: a green run of the current head of `main` is the condition step 4 of this issue asks for. Remove the `ci-failure` label to keep an issue open past a green run.',
            '',
            '---',
            '*Auto-generated by CI notification workflow*',
          ].join('\n');

          for (const issue of open) {
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            core.info(`closed #${issue.number} (green on ${short(run.head_sha)})`);
          }

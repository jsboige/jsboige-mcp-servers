name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        server: [jupyter-mcp-server, jinavigator-server]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        # Repo-wide node floor, set by @qdrant/js-client-rest@1.20.0 in roo-state-manager (#4808)
        node-version: '22.x'

    - name: Install dependencies
      run: |
        cd servers/${{ matrix.server }}
        npm install

    - name: Build
      run: |
        cd servers/${{ matrix.server }}
        npm run build

    - name: Run tests
      run: |
        cd servers/${{ matrix.server }}
        npm test

    - name: Run coverage tests
      run: |
        cd servers/${{ matrix.server }}
        npm run test:coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        directory: servers/${{ matrix.server }}/coverage
        flags: ${{ matrix.server }}
        name: ${{ matrix.server }}-coverage
        fail_ci_if_error: false

  roo-state-manager:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        # #4808: @qdrant/js-client-rest@1.20.0 engines.node >= 22 (undici@7 >= 20.18.1)
        node-version: '22.x'

    - name: Install dependencies
      run: |
        cd servers/roo-state-manager
        npm ci

    - name: Build
      run: |
        cd servers/roo-state-manager
        npm run build

    - name: Run tests (CI config - excludes platform-dependent tests)
      run: |
        cd servers/roo-state-manager
        npx vitest run --config vitest.config.ci.ts

  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        server: [jupyter-mcp-server, jinavigator-server]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        # Repo-wide node floor, set by @qdrant/js-client-rest@1.20.0 in roo-state-manager (#4808)
        node-version: '22.x'

    - name: Install dependencies
      run: |
        cd servers/${{ matrix.server }}
        npm install
    
    - name: Check README.md exists
      run: |
        cd servers/${{ matrix.server }}
        if [ ! -f README.md ]; then
          echo "README.md is missing for ${{ matrix.server }}"
          exit 1
        fi
    
    - name: Check Jest config exists
      run: |
        cd servers/${{ matrix.server }}
        if [ ! -f jest.config.js ] && [ ! -f jest.config.cjs ]; then
          echo "jest.config.js or jest.config.cjs is missing for ${{ matrix.server }}"
          exit 1
        fi
    
    - name: Check test files exist
      run: |
        cd servers/${{ matrix.server }}
        if [ ! -d __tests__ ]; then
          echo "Tests directory is missing for ${{ matrix.server }}"
          exit 1
        fi
        
        # Check for specific test files
        if [ ! -f __tests__/error-handling.test.js ]; then
          echo "error-handling.test.js is missing for ${{ matrix.server }}"
          exit 1
        fi
        
        if [ ! -f __tests__/performance.test.js ]; then
          echo "performance.test.js is missing for ${{ matrix.server }}"
          exit 1
        fi

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check main README.md
      run: |
        if [ ! -f README.md ]; then
          echo "Main README.md is missing"
          exit 1
        fi

    - name: Check documentation files
      run: |
        if [ ! -d docs ]; then
          echo "Docs directory is missing"
          exit 1
        fi

        if [ ! -f docs/getting-started.md ]; then
          echo "getting-started.md is missing"
          exit 1
        fi

        if [ ! -f docs/architecture.md ]; then
          echo "architecture.md is missing"
          exit 1
        fi

        if [ ! -f docs/troubleshooting.md ]; then
          echo "troubleshooting.md is missing"
          exit 1
        fi

    - name: Check server README files
      run: |
        for server in jupyter-mcp-server jinavigator-server roo-state-manager; do
          if [ ! -f servers/$server/README.md ]; then
            echo "README.md is missing for $server"
            exit 1
          fi
        done

  test-sk-agent:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r servers/sk-agent/requirements.txt
        # pytest-asyncio: test_sk_agent.py carries 32 @pytest.mark.asyncio
        # tests — without the plugin they fail with "async def functions are
        # not natively supported" (it was only ever present on dev machines).
        pip install pytest pytest-asyncio
        # nb_coder stage-5 tests drive a real `git commit` in a temp repo;
        # ephemeral runners carry no identity, dev seats inherit their global
        # config — provide one so the runner matches the seats.
        git config --global user.name "ci-sk-agent"
        git config --global user.email "ci-sk-agent@users.noreply.github.com"

    - name: Run sk-agent schema, config-provenance, facade, context-condensation, mid-turn-condensation, recursion-guard, mini-delegation-guard, fallback-visibility, document-processing, spec-composition, capability-matrix, inventory-validation, review-pr-propagation, empty-response-guard, run-conversation-empty-guard, group-chat-synthesizer, gitignore-guard, model-budget, sampling-penalty, rate-limit, sync-from-template, benchmark-model-derivation, mcp-connect-bound, model-connect-bound, model-default-headers, model-max-retries, claudish-response-headers, mcp-env/schema, mcp-container-runtime, source-file-channel, dockerfile-copy-guard, harness-portability, turn-control, stop-shutdown, nb-coder-verifier, nb-coder-create, nb-coder-scheduler, nb-coder-driver, nb-coder-gates, nb-coder-claim, nb-coder-invoke, nb-coder-plugin, nb-coder-json-repair, producer-label, repair-scope, revise, served-identity, spec, usage, absent_crate, claim_late, crate_cascade, dep_timeout, detach, error_digest, fresh_conv, private_path, ramp_admission, rate_limit, repair_bisect, repair_extend, toolless_gatewait, conformance_spec_tolerances, csharp_twin_view, ext_banner, repo_guards and writer-source-lines tests
      run: |
        cd servers/sk-agent
        python -m pytest test_sk_agent_schemas.py test_config.py test_config_provenance.py test_context_condensation.py test_mid_turn_condensation.py test_recursion_guard.py test_mini_delegation_guards.py test_fallback_visibility.py test_document_processing.py test_agent_specs.py test_capability_matrix.py test_inventory_validation.py test_review_pr.py test_empty_response_guard.py test_run_conversation_empty_guard.py test_group_chat_synthesizer.py test_gitignore_guard.py test_model_budget_overrides.py test_sampling_penalty_call_overrides.py test_rate_limit.py test_sync_from_template.py test_run_benchmark_models.py test_mcp_connect_timeout.py test_model_connect_timeout.py test_model_default_headers.py test_model_max_retries.py test_claudish_response_headers.py test_mcp_env_and_schema.py test_source_file_channel.py test_mcp_container_runtime.py test_sk_agent.py test_usage_telemetry.py test_dockerfile_copy_guard.py test_capacity_gate.py test_github_plugin.py test_nb_coder_entries.py test_nb_coder_plugin.py test_harness_portable.py test_turn_control.py test_stop_shutdown.py harness/nb_coder/test_nb_coder_invoke.py harness/nb_coder/test_nb_coder_verify.py harness/nb_coder/test_nb_coder_create.py harness/nb_coder/test_nb_coder_scheduler.py harness/nb_coder/test_nb_coder_driver.py harness/nb_coder/test_nb_coder_gates.py harness/nb_coder/test_nb_coder_claim.py harness/nb_coder/test_nb_coder_adopt.py harness/nb_coder/test_nb_coder_coord_refs.py harness/nb_coder/test_nb_coder_crate_api.py harness/nb_coder/test_nb_coder_grain_names.py harness/nb_coder/test_nb_coder_kernel_start.py harness/nb_coder/test_nb_coder_lot_spec.py harness/nb_coder/test_nb_coder_ramp_window.py harness/nb_coder/test_nb_coder_root_first.py harness/nb_coder/test_nb_coder_rust_panic.py harness/nb_coder/test_nb_coder_json_repair.py harness/nb_coder/test_nb_coder_producer_label.py harness/nb_coder/test_nb_coder_repair_scope.py harness/nb_coder/test_nb_coder_revise.py harness/nb_coder/test_nb_coder_served_identity.py harness/nb_coder/test_nb_coder_spec.py harness/nb_coder/test_nb_coder_usage.py harness/nb_coder/test_nb_coder_ramp_content.py harness/nb_coder/test_nb_coder_step_models.py harness/nb_coder/test_source_lines.py harness/nb_coder/test_nb_coder_repo_guards.py harness/nb_coder/test_nb_coder_ext_banner.py harness/nb_coder/test_nb_coder_absent_crate.py harness/nb_coder/test_nb_coder_claim_late.py harness/nb_coder/test_nb_coder_crate_cascade.py harness/nb_coder/test_nb_coder_dep_timeout.py harness/nb_coder/test_nb_coder_detach.py harness/nb_coder/test_nb_coder_error_digest.py harness/nb_coder/test_nb_coder_fresh_conv.py harness/nb_coder/test_nb_coder_private_path.py harness/nb_coder/test_nb_coder_ramp_admission.py harness/nb_coder/test_nb_coder_rate_limit.py harness/nb_coder/test_nb_coder_repair_bisect.py harness/nb_coder/test_nb_coder_repair_extend.py harness/nb_coder/test_nb_coder_toolless_gatewait.py harness/nb_coder/test_nb_coder_conformance_spec_tolerances.py harness/nb_coder/test_nb_coder_csharp_twin_view.py harness/nb_coder/test_nb_coder_claim_release.py harness/nb_coder/test_nb_coder_drift.py harness/nb_coder/test_nb_coder_gh_pin.py harness/nb_coder/test_nb_coder_integrate.py harness/nb_coder/test_nb_coder_midrun_claim.py harness/nb_coder/test_nb_coder_pr_body_integration.py harness/nb_coder/test_nb_coder_rust_conformance.py harness/nb_coder/test_nb_coder_unit_result.py harness/nb_coder/test_nb_coder_unmeasured.py -v
